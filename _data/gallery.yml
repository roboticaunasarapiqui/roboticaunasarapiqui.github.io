# Fotos del carrusel de about.html. El orden del archivo es el orden en que salen:
# la primera es la que se ve al entrar, así que va la que mejor presenta el proyecto.
#
# Cada foto lleva:
#   src      archivo dentro de images/ (.webp, 1600 px de ancho como máximo)
#   alt      qué se ve en la foto, en una frase
#   width    ancho real en píxeles
#   height   alto real en píxeles (con los dos, la página no salta al cargar la foto)
#
# Recomendado: de 8 a 12 fotos. Pasadas 20, mejor una página de álbum aparte.
# El orden actual alterna fotos horizontales y verticales para que la tira no se vea repetida.

