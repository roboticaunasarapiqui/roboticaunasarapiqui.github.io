<header class="site-header">
    <a class="site-brand" href="{{ '/' | relative_url }}"><img src="{{ '/images/logo-rana.webp' | relative_url }}" alt="Robótica STEAM UNA, inicio" width="500" height="500"></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menú de navegación"><span class="nav-toggle-bars"></span></button>
    <nav class="site-nav" id="site-nav" aria-label="Principal">
        {%- for item in site.data.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
        {%- endfor %}
    </nav>
</header>
